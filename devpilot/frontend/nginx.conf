# Serves the built single-page app.
#
# History-mode routing means /projects/1/chat is a client route, not a file: anything that is not a
# real asset has to fall back to index.html or a refresh on a deep link returns 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        # Hashed filenames, so they can be cached hard.
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
