# DevPilot 标准 Agent 组合。
#
# 这份文件决定每个 Agent 的人设、模型路由、步数预算与可见 Tool。
# 作用域只能收窄：这里列出的 Tool 与权限必须是应用已注册能力的子集，
# 运行时会校验，试图扩权的 profile 会让应用启动失败。
#
# 执行时 ToolPolicy 仍会二次鉴权，可见不等于可执行。写操作还需要同时满足
# allowMutating 与 app.runtime.tool.mutating-allow-list 两道门。

version: standard@1

agents:
  # 调度者：自己不碰代码和日志，只把任务分派给专业 Agent 并汇总证据。
  # 它的工具是「问某个专业 Agent」，因此委派复用了同一条 Tool 执行管线，
  # 专业 Agent 作为嵌套 run 出现，审计轨迹自然形成树。
  supervisor:
    displayName: 调度 Agent
    description: 判断需要哪些专业 Agent、分派任务并汇总为最终结论
    promptFile: agents/supervisor.md
    modelRoute: chat.default
    maxSteps: 10
    tools:
      - askCodeAgent
      - askLogAgent
      - askKnowledgeAgent
      - askTestAgent
      - askDebugAgent
    permissions:
      - AGENT_DELEGATE

  # 同时绑定代码与日志工具的通用排查助手，用于单 Agent 验证。
  # allowSkills 让它能看见本项目已启用的技能——技能是运行时安装的，profile 无法预先写出名字，
  # 只能声明「这类 Agent 可以用技能」。装哪些由人按项目决定，真要执行还要在会话里审批。
  debug_agent:
    displayName: 调试助手
    description: 通过检索代码与日志定位研发问题，适用于故障排查与代码定位
    promptFile: agents/debug_agent.md
    modelRoute: chat.default
    maxSteps: 6
    allowSkills: true
    tools:
      - listFiles
      - searchCode
      - readCodeFile
      - searchLogs
      - getLogByTraceId
      - getRecentErrorSummary
    permissions:
      - CODE_READ
      - LOG_READ

  code_agent:
    displayName: 代码分析 Agent
    description: 阅读与分析项目 Java 代码，适用于代码定位、调用链分析和异常代码分析
    promptFile: agents/code_agent.md
    modelRoute: chat.default
    maxSteps: 6
    tools:
      - listFiles
      - searchCode
      - readCodeFile
    permissions:
      - CODE_READ

  log_agent:
    displayName: 日志分析 Agent
    description: 检索与聚合系统日志，适用于故障现象定位、异常统计和调用链还原
    promptFile: agents/log_agent.md
    modelRoute: chat.default
    maxSteps: 6
    tools:
      - searchLogs
      - getLogByTraceId
      - getRecentErrorSummary
    permissions:
      - LOG_READ

  knowledge_agent:
    displayName: 知识库 Agent
    description: 检索项目文档、开发规范与历史故障复盘，适用于「我们的规范是什么」「以前遇到过吗」
    promptFile: agents/knowledge_agent.md
    modelRoute: chat.default
    maxSteps: 5
    tools:
      - searchKnowledge
      - listKnowledgeDocuments
    permissions:
      - KNOWLEDGE_READ

  # 唯一允许写操作的 Agent，且只能写测试用例。
  test_agent:
    displayName: 测试设计 Agent
    description: 根据代码与故障结论设计测试用例并落库，适用于回归方案与验证设计
    promptFile: agents/test_agent.md
    modelRoute: chat.default
    maxSteps: 8
    allowMutating: true
    tools:
      - searchCode
      - readCodeFile
      - searchLogs
      - searchKnowledge
      - saveTestCases
    permissions:
      - CODE_READ
      - LOG_READ
      - KNOWLEDGE_READ
      - TEST_CASE_WRITE
