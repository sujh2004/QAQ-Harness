# Enables the DashScope chat model. Activate together with your usual profile, for example:
#
#   mvn spring-boot:run "-Dspring-boot.run.profiles=dev,dashscope"
#
# DASHSCOPE_API_KEY must be set; the key is read from the environment and never written to
# configuration, logs or session events.
spring:
  autoconfigure:
    # Chat and embedding are re-enabled — embedding is what the knowledge base runs on. Image,
    # video, audio, rerank and the agent API are still not used by DevPilot.
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeVideoAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: ${CHAT_MODEL:qwen-plus}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:text-embedding-v3}
